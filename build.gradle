plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

ext {
    jfxVersion = '21.0.9'
    jacksonVer = '2.17.2'
    aparapiVer = '3.0.2'
    junitVer = '5.10.2'
}

dependencies {
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVer}"
    implementation "com.aparapi:aparapi:${aparapiVer}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junitVer}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

javafx {
    version = jfxVersion
    modules = [ 'javafx.controls', 'javafx.graphics', 'javafx.base', 'javafx.swing']
}

application {
    // Main.java 의 FQCN (패키지명 포함)
    mainClass = 'app.Main'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

// ─────────────────────────────────────────────────────────────────────────────
// 회귀 테스트 (엔진 수치 검증)
//
// 엔진은 JavaFX 타입(Point2D/Color)을 값 객체로만 쓰므로 툴킷 초기화 없이
// 헤드리스로 동작한다. Application.launch() 를 하지 않으므로 CI 에서도 안전.
// ─────────────────────────────────────────────────────────────────────────────
tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}

// ─────────────────────────────────────────────────────────────────────────────
// 골든 기준 데이터 생성
//
//   ./gradlew goldenDump                 → src/test/resources/golden 에 기록
//   ./gradlew goldenDump -Pdir=<경로>     → 지정 경로에 기록
//
// ⚠️ 엔진 동작을 의도적으로 바꿨을 때만 재생성할 것.
//    리팩터링(동작 보존) 시에는 재생성하지 말고 기존 골든으로 검증해야 한다.
// ─────────────────────────────────────────────────────────────────────────────
tasks.register('goldenDump', JavaExec) {
    group = 'verification'
    description = '데스크톱 엔진 기준으로 골든 RSSI 격자를 덤프한다 (회귀 테스트 기준값)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'app.tools.GoldenDump'
    def outDir = project.findProperty('dir') ?: "${projectDir}/src/test/resources/golden"
    doFirst {
        file(outDir).mkdirs()
        args = [outDir.toString()]
    }
}
