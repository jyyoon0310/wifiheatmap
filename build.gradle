plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

ext {
    jfxVersion = '21.0.9'
    jacksonVer = '2.17.2'
    opencvVer  = '4.7.0-1.5.9'   // ← 여기만 변경
    aparapiVer = '3.0.2'
}

dependencies {
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVer}"
    implementation "org.bytedeco:opencv-platform:${opencvVer}"
    implementation "com.aparapi:aparapi:${aparapiVer}"
}

javafx {
    version = jfxVersion
    modules = [ 'javafx.controls', 'javafx.graphics', 'javafx.base', 'javafx.swing']
}

application {
    // Main.java 의 FQCN (패키지명 포함)
    mainClass = 'app.Main'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

def isMacOs = org.gradle.internal.os.OperatingSystem.current().isMacOsX()
def nativeOutDir = layout.buildDirectory.dir("native")

tasks.register('buildMetalNative') {
    onlyIf { isMacOs }
    inputs.file('src/main/native/metal_solver_jni.mm')
    outputs.file(layout.buildDirectory.file('native/libmetalsolverjni.dylib'))
    doLast {
        def javaHome = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get().metadata.installationPath.asFile
        def includeDir = new File(javaHome, 'include')
        def includeDarwinDir = new File(includeDir, 'darwin')

        def sdkOut = new ByteArrayOutputStream()
        exec {
            commandLine 'xcrun', '--sdk', 'macosx', '--show-sdk-path'
            standardOutput = sdkOut
        }
        def sdkPath = sdkOut.toString().trim()

        def outDir = nativeOutDir.get().asFile
        outDir.mkdirs()
        def outFile = new File(outDir, 'libmetalsolverjni.dylib')

        exec {
            commandLine 'clang++',
                    '-std=c++17',
                    '-fobjc-arc',
                    '-dynamiclib',
                    '-O3',
                    '-fvisibility=hidden',
                    '-mmacosx-version-min=13.0',
                    '-isysroot', sdkPath,
                    "-I${includeDir.absolutePath}",
                    "-I${includeDarwinDir.absolutePath}",
                    '-framework', 'Foundation',
                    '-framework', 'Metal',
                    '-o', outFile.absolutePath,
                    'src/main/native/metal_solver_jni.mm'
        }
    }
}

tasks.named('run', JavaExec).configure {
    if (isMacOs) {
        dependsOn(tasks.named('buildMetalNative'))
        doFirst {
            jvmArgs("-Djava.library.path=${nativeOutDir.get().asFile.absolutePath}")
        }
    }
}
